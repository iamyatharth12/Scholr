<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>School Details — Scholr</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ═══════════════════════════════════════════
       NAVBAR
  ═══════════════════════════════════════════ -->
  <header class="navbar" id="navbar">
    <div class="container navbar__inner">
      <a href="index.html" class="navbar__logo">Scholr</a>
      <nav class="navbar__links" id="nav-links">
        <a href="index.html#listings" class="nav-link">Explore</a>
        <a href="saved.html" class="nav-link">Saved</a>
        <a href="index.html#about" class="nav-link">About</a>
      </nav>
      <button class="hamburger" id="hamburger" aria-label="Toggle menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main class="school-page" id="school-page">
    <div class="container">
      <div class="school-detail-header">
        <a href="index.html" class="btn btn--ghost back-btn">← Back to Schools</a>
      </div>
      
      <div id="school-container" class="school-detail-container fade-in">
         <!-- Details will be loaded here -->
         <div class="loading-skeleton">
           <div class="skeleton-card" style="height: 400px; width: 100%;"></div>
         </div>
      </div>
      
      <div id="error-state" class="empty-state" style="display: none;">
        <div class="empty-state__icon">⚠️</div>
        <h3 class="empty-state__title">School not found</h3>
        <p class="empty-state__sub" id="school-error-msg">The school you are looking for does not exist or an error occurred.</p>
        <br>
        <a href="index.html" class="btn btn--primary">Return to Explore</a>
      </div>
    </div>
  </main>

  <!-- ═══════════════════════════════════════════
       FOOTER
  ═══════════════════════════════════════════ -->
  <footer class="footer" id="footer">
    <div class="container footer__inner">
      <span class="footer__brand">Scholr</span>
      <p class="footer__copy">&copy; 2026 Scholr. All rights reserved.</p>
      <nav class="footer__links">
        <a href="index.html" class="footer-link">Explore</a>
        <a href="index.html#about" class="footer-link">About</a>
      </nav>
    </div>
  </footer>

  <!-- Supabase JS client (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Plausible Analytics -->
  <script defer data-domain="scholr-eight.vercel.app" src="https://plausible.io/js/script.js"></script>
  <!-- Scholr Analytics -->
  <script src="js/analytics.js"></script>
  <!-- Scholr Trust module -->
  <script src="js/trust.js"></script>
  <!-- Detail view logic -->
  <script src="school.js"></script>
</body>
</html>
